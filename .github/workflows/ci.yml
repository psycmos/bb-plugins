name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-aside
          - bb-plugin-canvas
          - bb-plugin-crew
          - bb-plugin-graph-studio
          - bb-plugin-listen
          - bb-plugin-recall
          - bb-plugin-slim-nav
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test --if-present
