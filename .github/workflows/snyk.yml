name: Snyk

# Not on every push: each run tests every plugin, and the org's monthly
# open-source test limit ran out (BBP-316). Code changes cannot introduce
# a dependency vulnerability; a new advisory is caught by the weekly run.
on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/.snyk'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    # Snyk's GitHub integration already checks every pull request. This job
    # adds a failing check on main and only runs once SNYK_TOKEN is set.
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk@latest test --all-projects --severity-threshold=high
